aid: reven-pharmaceuticals
name: Reven Pharmaceuticals
description: >-
  Reven Pharmaceuticals is a privately held, clinical-stage biopharmaceutical company founded in 1999 and
  headquartered in Broomfield, Colorado. Reven develops medicines from its proprietary RJX Technology
  platform - a patented, first-in-class intravenous composition of anti-oxidant and anti-inflammatory
  ingredients - and is advancing candidates for sepsis, multi-system inflammation, cytokine release
  syndrome, ARDS and vascular, oncology, CNS and ocular indications. Its lead candidate, Rejuveinix (RJX),
  completed a double-blind, placebo-controlled Phase 1 dose-escalation study in healthy volunteers and
  received FDA clearance of an Investigational New Drug application for the treatment of COVID-19. Reven
  publishes a corporate and investor website at reven.com covering its pipeline, modalities, clinical
  trials, expanded-access program and news, but operates no public developer program, API, SDK or
  machine-readable interface of any kind.
